  -- Remove landing page from frontend, redirect root / directly to /sign-in
  -- Remove WebAdminApp
  -- Feedback and support tickets should be sent to my email (valnos04@gmail.com)
  -- Remove mail verification from frontend and backend
  - Remove Google OAuth
  - Remove SEO metadata from frontend
  - Remove hardcoded production URLs (Railway, custom domains) — replace with env vars
  - Data Protection keys currently persisted to DB — document this requirement
  - Review CORS origins — should come from env var, not hardcoded list
  - Audit appsettings.json — ensure no real secrets are committed; add appsettings.Example.json
  - Add .env.example for frontend with all required NEXT_PUBLIC_* variables
  - App set up should be as simple as possible for self-hosters — ideally one command to run backend + frontend + postgres with docker-compose (after writing thedocker-compose file check if everything works)
  - Add CONTRIBUTING.md, update README with self-hosting instructions

