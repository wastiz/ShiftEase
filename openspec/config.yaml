schema: spec-driven

context: |
  ## Project: ShiftEase
  Shift scheduling SaaS platform, I want to make it open-sourced. Managers (Employers) create
  organizations, departments, and employees, then generate and publish work schedules.
  Employees view their shifts, submit time-off requests, and set preferences.

  ## Domain model
  - Two roles: Employer (manager) and Employee
  - Hierarchy: Organization → Department → Employee
  - Schedules contain Shifts built from ShiftTemplates (types)
  - Schedule generation: Greedy, ACO (Ant Colony Optimization), GA (Genetic
    Algorithm), and ACO+GA hybrid algorithms
  - Time-off: Vacations, SickLeave, PersonalDays — each has a request/approval flow
  - Employee preferences: weekday preference, shift-type preference
  - Supporting features: Notifications, Support messages, Feedback, Analytics

  ## Backend
  - Runtime: .NET 9, ASP.NET Core Web API
  - Database: PostgreSQL, Entity Framework Core (code-first; migrations live in DAL)
  - Architecture: strict layered — Domain → DAL.Contracts / DAL / DAL.DTO →
    BLL.Contracts / BLL.DTO / BLL → API.DTO / API
  - Pattern: repository interfaces (IXxxRepository) implemented in DAL; service
    interfaces (IXxxService) implemented in BLL; API controllers call BLL services
  - Auth: JWT in HttpOnly cookies — 15-min access token + refresh token; Google OAuth
    via Google.Apis.Auth
  - Security: ASP.NET Core Data Protection encrypts PII fields (phone, hourly rate)
    in PostgreSQL; keys persisted to DB and shared across restarts
  - Rate limiting: fixed-window on /login, /register, /forgot-password endpoints
  - Error handling: centralized exception handler maps custom exceptions
    (ValidationException → 400, UnauthorizedException → 401, ForbiddenException → 403,
    NotFoundException → 404) to a consistent JSON shape { errorCode, message, errors }
  - Exports: ClosedXML for Excel schedule export
  - Analytics: background channel service (fire-and-forget, non-blocking)
  - Tests: xUnit + Moq + WebApplicationFactory (integration tests, in-memory EF)
  - Docs: Swagger at root path in all environments
  - Runtime config (appsettings.json): Jwt (SecretKey, Issuer, Audience,
    AccessTokenExpirationMinutes), EmailSettings (SMTP), GoogleAuth (ClientId,
    ClientSecret), ConnectionStrings:DefaultConnection
  - Conventions: Nullable enable, ImplicitUsings enable, PascalCase everywhere,
    scoped DI lifetime for all repositories and services

  ## Frontend
  - Framework: Next.js 15 (App Router, RSC enabled), React 19, TypeScript 5
  - Styling: Tailwind CSS v4 + shadcn/ui (new-york style, neutral base color,
    Lucide icons); shadcn components live at @/components/ui/shadcn
  - Component layout: custom reusable UI → @/components/ui/; feature-level
    components → @/components/features/
  - Server state: TanStack Query v5; API hooks under @/hooks/api/
  - Client state: Zustand v5 (authStore, orgStore)
  - Forms: React Hook Form + Zod v4
  - i18n: next-intl; locales en / et / ru; translation files in messages/*.json
  - Dates: date-fns v4
  - Charts: Recharts
  - Animations: Framer Motion
  - Drag-and-drop: Atlaskit Pragmatic Drag and Drop (schedule builder)
  - API client: custom fetch wrapper at @/lib/api.ts with automatic token refresh
    and deduplication; throws ApiError with { status, errorCode, errors }
  - Auth flow: HttpOnly cookies; Next.js middleware enforces role-based routing —
    public (/, /sign-in, /reset-password, /onboarding), employer (/dashboard,
    /employees, /schedules, /organizations), employee (/my-shifts, /my-requests,
    /profile)
  - Path aliases: @/components, @/lib, @/hooks, @/stores, @/types, @/helpers
  - Conventions: strict TypeScript, no `any`; ESLint config-next; components are
    PascalCase files; hooks are camelCase prefixed with `use`

  ## Infrastructure
  - Both services are Dockerized (Dockerfile in each directory)
  - CORS: backend allows localhost:3000, localhost:3006, and production domains
  - No monorepo tooling — frontend and backend are independent projects under one repo

