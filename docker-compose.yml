services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shiftease}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-shiftease}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: >-
        Host=db;Port=5432;
        Database=${POSTGRES_DB:-shiftease};
        Username=${POSTGRES_USER:-postgres};
        Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      Jwt__SecretKey: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      Jwt__Issuer: ${JWT_ISSUER:-ShiftEase}
      Jwt__Audience: ${JWT_AUDIENCE:-ShiftEaseUsers}
      Jwt__AccessTokenExpirationMinutes: "15"
      EmailSettings__SmtpHost: ${SMTP_HOST:-}
      EmailSettings__SmtpPort: ${SMTP_PORT:-587}
      EmailSettings__SmtpUsername: ${SMTP_USERNAME:-}
      EmailSettings__SmtpPassword: ${SMTP_PASSWORD:-}
      EmailSettings__FromEmail: ${FROM_EMAIL:-}
      # Semicolon-separated list of allowed CORS origins
      Cors__Origins: ${CORS_ORIGINS:-http://localhost:3000}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked into client-side JS bundles — must be reachable from the USER'S BROWSER
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8080/api}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      # Overrides NEXT_PUBLIC_API_URL at runtime for server-side code (middleware, SSR).
      # Uses the internal Docker network name so the Next.js server can reach the backend.
      NEXT_PUBLIC_API_URL: http://backend:8080/api

volumes:
  postgres_data:
